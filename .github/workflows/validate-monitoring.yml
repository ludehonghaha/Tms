name: Validate monitoring feature

on:
  push:
    branches:
      - feature/monitoring-runtime-completion

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: springboot-backend/pom.xml
      - name: Build backend
        working-directory: springboot-backend
        run: mvn -B -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vite-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: vite-frontend
        run: npm ci
      - name: Build frontend
        working-directory: vite-frontend
        run: npm run build

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache-dependency-path: go-gost/go.sum
      - name: Build Runtime
        working-directory: go-gost
        run: go build ./...
