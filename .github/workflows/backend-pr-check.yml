name: Network Orchestration PR Check

on:
  push:
    branches:
      - codex/feature-network-orchestration
  pull_request:
    paths:
      - 'springboot-backend/**'
      - 'vite-frontend/**'
      - 'docker-compose-v4.yml'
      - 'docker-compose-v6.yml'
      - 'docker-compose-hybrid.yml'
      - '.github/workflows/backend-pr-check.yml'

permissions:
  contents: read

jobs:
  backend-build:
    name: Maven test + package (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: springboot-backend/pom.xml

      - name: Run orchestration and production safety tests
        working-directory: springboot-backend
        run: mvn -B -Dtest=SingboxUtilNbSsTests,NetworkOrchestrationSafetyTest,NetworkOrchestrationChainValidationTest test

      - name: Compile and package backend
        working-directory: springboot-backend
        run: mvn -B -DskipTests package

  frontend-build:
    name: TypeScript + Vite build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vite-frontend/package.json

      - name: Install frontend dependencies
        working-directory: vite-frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build frontend
        working-directory: vite-frontend
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm run build

  compose-validation:
    name: Docker Compose safety config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DB_NAME: gost
      DB_USER: gost
      DB_PASSWORD: ci-test-password
      JWT_SECRET: ci-test-jwt-secret
      BACKEND_PORT: '16365'
      FRONTEND_PORT: '16366'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate IPv4 Compose with Apply default-off
        run: |
          docker compose -f docker-compose-v4.yml config > /tmp/v4.yml
          grep -q 'TMS_NETWORK_APPLY_ENABLED: "false"' /tmp/v4.yml || grep -q 'TMS_NETWORK_APPLY_ENABLED: false' /tmp/v4.yml

      - name: Validate IPv6 Compose with Apply default-off
        run: |
          docker compose -f docker-compose-v6.yml config > /tmp/v6.yml
          grep -q 'TMS_NETWORK_APPLY_ENABLED: "false"' /tmp/v6.yml || grep -q 'TMS_NETWORK_APPLY_ENABLED: false' /tmp/v6.yml

      - name: Validate Hybrid Compose and explicit Apply enable propagation
        env:
          TMS_NETWORK_APPLY_ENABLED: 'true'
        run: |
          docker compose -f docker-compose-hybrid.yml config > /tmp/hybrid.yml
          grep -q 'TMS_NETWORK_APPLY_ENABLED: "true"' /tmp/hybrid.yml || grep -q 'TMS_NETWORK_APPLY_ENABLED: true' /tmp/hybrid.yml
