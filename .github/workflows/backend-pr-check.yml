name: Network Orchestration PR Check

on:
  push:
    branches:
      - codex/feature-network-orchestration
  pull_request:
    paths:
      - 'springboot-backend/**'
      - 'vite-frontend/**'
      - '.github/workflows/backend-pr-check.yml'

permissions:
  contents: read

jobs:
  backend-build:
    name: Maven test + package (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: springboot-backend/pom.xml

      - name: Run network orchestration safety tests
        working-directory: springboot-backend
        run: mvn -B -Dtest=NetworkOrchestrationSafetyTest test

      - name: Compile and package backend
        working-directory: springboot-backend
        run: mvn -B -DskipTests package

  frontend-build:
    name: TypeScript + Vite build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vite-frontend/package.json

      - name: Install frontend dependencies
        working-directory: vite-frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build frontend
        working-directory: vite-frontend
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm run build
