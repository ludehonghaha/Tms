name: Build Network Gray Images

on:
  push:
    branches:
      - codex/feature-network-orchestration
    paths:
      - '.github/workflows/network-gray-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-gray-images:
    name: Build amd64 gray images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact gray commit
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push uniquely tagged backend/frontend
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="network-gray-${SHORT_SHA}"
          BACKEND="ghcr.io/teminuosi/springboot-backend:${TAG}"
          FRONTEND="ghcr.io/teminuosi/vite-frontend:${TAG}"

          echo "GRAY_COMMIT=${GITHUB_SHA}"
          echo "GRAY_TAG=${TAG}"
          echo "BACKEND_IMAGE=${BACKEND}"
          echo "FRONTEND_IMAGE=${FRONTEND}"

          docker buildx build \
            --platform linux/amd64 \
            --push \
            --build-arg BUILD_COMMIT="${SHORT_SHA}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "${BACKEND}" \
            ./springboot-backend

          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t "${FRONTEND}" \
            ./vite-frontend

          docker buildx imagetools inspect "${BACKEND}"
          docker buildx imagetools inspect "${FRONTEND}"

          {
            echo "### Network gray images"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Backend: \`${BACKEND}\`"
            echo "- Frontend: \`${FRONTEND}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- No \`:latest\` tag is written by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
